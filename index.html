<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบวางแผนการทำงานประจำปี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/sort@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { font-family: 'Sarabun', sans-serif; width: 100%; height: 100%; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
        [x-cloak]{display:none !important;}
        @keyframes custom-blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.96); }
        }
        .blink-alert { animation: custom-blink 1s infinite ease-in-out; }
        @media (max-width: 768px) {
            .calendar-cell { min-height: 90px !important; padding: 2px !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-full flex flex-col" x-data="plannerApp()">

    <!-- LOGIN SCREEN -->
    <div x-show="!isLoggedIn" x-cloak class="fixed inset-0 z-[100] bg-slate-900/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 space-y-6 text-center">
            <div class="space-y-2">
                <h2 class="text-xl sm:text-2xl font-bold text-indigo-900">ระบบวางแผนการทำงานประจำปี</h2>
                <p class="text-xs sm:text-sm text-slate-500">กรอกรหัสผ่านเพื่อเข้าใช้งาน หรือเข้าชมระบบ</p>
            </div>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-700">รหัสผ่าน (Password)</label>
                    <input type="password" x-model="loginPassword" @keyup.enter="handleLogin()" placeholder="รหัสผ่านเริ่มต้น 1234..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button @click="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors cursor-pointer">
                    เข้าสู่ระบบเจ้าหน้าที่
                </button>
            </div>
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-xs">หรือ</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>
            <button @click="handleViewerLogin()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-lg text-sm font-semibold transition-colors cursor-pointer">
                👀 เข้าสู่ระบบสำหรับผู้เข้าชม (View Only)
            </button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div x-show="isLoggedIn" x-cloak class="flex-1 flex flex-col w-full">
        <header class="bg-indigo-700 text-white shadow-md w-full">
            <div class="w-full px-4 sm:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
                <div class="text-center md:text-left">
                    <h1 class="text-xl sm:text-2xl font-bold">ระบบวางแผนการทำงานประจำปี</h1>
                    <p class="text-xs sm:text-sm opacity-90" x-text="'ผู้ใช้งาน: ' + currentUserName"></p>
                </div>
                <button @click="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs cursor-pointer">🚪 ออกจากระบบ</button>
            </div>
        </header>

        <main class="flex-1 w-full px-3 sm:px-6 py-4 sm:py-6 flex flex-col">
            <div x-show="isLoading" class="text-center py-20 text-slate-500 font-medium">กำลังโหลดข้อมูล...</div>

            <div x-show="!isLoading" x-cloak class="flex-1 flex flex-col space-y-4">
                <div class="flex border-b border-slate-200 mb-4 overflow-x-auto">
                    <button @click="activeTab = 'calendarView'" :class="activeTab === 'calendarView' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="py-2.5 px-4 text-sm font-semibold border-b-2 cursor-pointer">มุมมองปฏิทิน</button>
                    <button @click="activeTab = 'tasks'" :class="activeTab === 'tasks' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="py-2.5 px-4 text-sm font-semibold border-b-2 cursor-pointer">รายการงาน & PDSA</button>
                    <button @click="activeTab = 'reports'" :class="activeTab === 'reports' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="py-2.5 px-4 text-sm font-semibold border-b-2 cursor-pointer">ออกรายงาน PDF & ภาระงาน</button>
                    <button @click="activeTab = 'categories'" :class="activeTab === 'categories' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="py-2.5 px-4 text-sm font-semibold border-b-2 cursor-pointer">จัดการกลุ่มงาน</button>
                    <button @click="activeTab = 'owners'" :class="activeTab === 'owners' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="py-2.5 px-4 text-sm font-semibold border-b-2 cursor-pointer">จัดการบุคลากร</button>
                </div>

                <!-- CALENDAR TAB -->
                <div x-show="activeTab === 'calendarView'" class="space-y-4 flex-1 flex flex-col">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <button @click="prevMonth()" class="bg-slate-100 px-3 py-1.5 rounded-lg text-sm cursor-pointer">&lt; ก่อนหน้า</button>
                            <h2 class="text-base font-bold text-indigo-900 w-40 text-center" x-text="currentMonthName"></h2>
                            <button @click="nextMonth()" class="bg-slate-100 px-3 py-1.5 rounded-lg text-sm cursor-pointer">ถัดไป &gt;</button>
                        </div>
                        <button @click="openTaskModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-sm font-medium cursor-pointer">+ เพิ่มงาน</button>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                        <div class="grid grid-cols-7 bg-slate-100 border-b text-center text-xs font-bold text-slate-600 py-2">
                            <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
                        </div>
                        <div class="grid grid-cols-7 bg-slate-200 gap-px flex-1">
                            <template x-for="day in calendarDays" :key="day.dateStr || Math.random()">
                                <div class="calendar-cell min-h-[120px] p-1 flex flex-col bg-white justify-between" :class="day.isCurrentMonth ? '' : 'bg-slate-50 text-slate-300'">
                                    <span class="text-xs font-semibold px-1 rounded" :class="day.isToday ? 'bg-indigo-600 text-white' : ''" x-text="day.dayNum"></span>
                                    <div class="space-y-1 my-1 flex-1">
                                        <template x-for="item in getTasksForDate(day.dateStr)" :key="item.task.id">
                                            <div @click="editTask(item.task)" class="text-[10px] p-1 rounded bg-indigo-600 text-white truncate cursor-pointer font-medium" x-text="item.task.title"></div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TASKS TAB -->
                <div x-show="activeTab === 'tasks'" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h2 class="font-bold text-slate-700">รายการงานทั้งหมดในระบบ</h2>
                        <button @click="openTaskModal()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium">+ เพิ่มงานใหม่</button>
                    </div>
                    <div class="divide-y">
                        <template x-for="task in tasks" :key="task.id">
                            <div class="py-3 flex justify-between items-center">
                                <div>
                                    <span class="text-[10px] px-2 py-0.5 rounded text-white" :style="'background-color: ' + getCategoryColor(task.category)" x-text="task.category"></span>
                                    <h3 class="font-bold text-sm" x-text="task.title"></h3>
                                    <p class="text-xs text-slate-500" x-text="'วันที่: ' + (task.doStart || '-') + ' ถึง ' + (task.doEnd || '-')"></p>
                                </div>
                                <div class="flex gap-2">
                                    <button @click="editTask(task)" class="text-xs px-2 py-1 border rounded text-indigo-600 hover:bg-indigo-50">แก้ไข</button>
                                    <button @click="deleteTask(task)" class="text-xs px-2 py-1 border rounded text-rose-600 hover:bg-rose-50">ลบ</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- REPORTS TAB -->
                <div x-show="activeTab === 'reports'" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <h2 class="text-base font-bold text-indigo-900">ออกรายงาน (PDF / พิมพ์)</h2>
                    <div class="flex gap-3">
                        <button @click="window.print()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-semibold">🖨️ พิมพ์รายงาน</button>
                    </div>
                </div>

                <!-- CATEGORIES TAB -->
                <div x-show="activeTab === 'categories'" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <h2 class="text-base font-bold text-slate-800">จัดการกลุ่มงานหลัก</h2>
                    <div class="flex gap-2">
                        <input type="text" x-model="newCategoryName" placeholder="เพิ่มกลุ่มงาน..." class="border rounded px-3 py-2 text-xs">
                        <button @click="addCategory()" class="bg-indigo-600 text-white px-4 py-2 rounded text-xs">เพิ่ม</button>
                    </div>
                    <div class="space-y-2">
                        <template x-for="cat in categories" :key="cat.id">
                            <div class="flex justify-between items-center border p-2 rounded">
                                <span class="text-xs font-bold" x-text="cat.name"></span>
                                <button @click="deleteCategory(cat.id)" class="text-xs text-rose-600">ลบ</button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- OWNERS TAB -->
                <div x-show="activeTab === 'owners'" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <h2 class="text-base font-bold text-slate-800">จัดการบุคลากร</h2>
                    <div class="flex gap-2">
                        <input type="text" x-model="newOwnerName" placeholder="ชื่อบุคลากร..." class="border rounded px-3 py-2 text-xs">
                        <button @click="addOwner()" class="bg-indigo-600 text-white px-4 py-2 rounded text-xs">เพิ่ม</button>
                    </div>
                    <div class="space-y-2">
                        <template x-for="o in owners" :key="o.id">
                            <div class="flex justify-between items-center border p-2 rounded">
                                <span class="text-xs font-bold" x-text="o.name"></span>
                                <button @click="deleteOwner(o.id)" class="text-xs text-rose-600">ลบ</button>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- TASK MODAL -->
    <div x-show="isModalOpen" x-cloak class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4" @click.stop>
            <h3 class="text-base font-bold" x-text="currentTask.id ? 'แก้ไขงาน' : 'เพิ่มงานใหม่'"></h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1">กลุ่มงาน</label>
                    <select x-model="currentTask.category" class="w-full border rounded-lg p-2 text-xs bg-white">
                        <option value="">-- เลือกกลุ่มงาน --</option>
                        <template x-for="cat in categories" :key="cat.id">
                            <option :value="cat.name" x-text="cat.name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">ชื่องาน</label>
                    <input type="text" x-model="currentTask.title" class="w-full border rounded-lg p-2 text-xs" placeholder="ระบุชื่องาน...">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold mb-1">วันที่เริ่มต้น</label>
                        <input type="date" x-model="currentTask.doStart" class="w-full border rounded-lg p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">วันที่สิ้นสุด</label>
                        <input type="date" x-model="currentTask.doEnd" class="w-full border rounded-lg p-2 text-xs">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button @click="isModalOpen = false" class="px-3 py-2 border rounded-lg text-xs">ยกเลิก</button>
                <button @click="saveTask()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        function plannerApp() {
            return {
                isLoggedIn: false,
                currentUserName: '',
                currentUserRole: 'viewer',
                loginPassword: '',
                activeTab: 'calendarView',
                isLoading: false,
                isModalOpen: false,
                tasks: [],
                categories: [],
                owners: [],
                newCategoryName: '',
                newOwnerName: '',
                currentTask: { id: null, category: '', title: '', doStart: '', doEnd: '' },
                currentYearNum: new Date().getFullYear(),
                currentMonthIndex: new Date().getMonth(),
                monthNames: ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'],

                init() {
                    const savedUser = localStorage.getItem('planner_logged_user');
                    if (savedUser) {
                        this.currentUserName = savedUser;
                        this.isLoggedIn = true;
                    }
                    this.loadData();
                },

                handleLogin() {
                    if (this.loginPassword.trim() !== '') {
                        this.currentUserName = 'เจ้าหน้าที่ (Admin)';
                        this.isLoggedIn = true;
                        localStorage.setItem('planner_logged_user', this.currentUserName);
                    }
                },

                handleViewerLogin() {
                    this.currentUserName = 'ผู้เข้าชมทั่วไป';
                    this.isLoggedIn = true;
                    localStorage.setItem('planner_logged_user', this.currentUserName);
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('planner_logged_user');
                },

                loadData() {
                    this.isLoading = true;
                    try {
                        const localTasks = localStorage.getItem('local_planner_tasks');
                        const localCats = localStorage.getItem('local_planner_cats');
                        const localOwners = localStorage.getItem('local_planner_owners');

                        this.tasks = localTasks ? JSON.parse(localTasks) : [];
                        this.categories = localCats ? JSON.parse(localCats) : [
                            { id: '1', name: 'กลุ่มงานบริหารทั่วไป', color: '#7c3aed' },
                            { id: '2', name: 'กลุ่มงานยุทธศาสตร์', color: '#2563eb' }
                        ];
                        this.owners = localOwners ? JSON.parse(localOwners) : [
                            { id: '1', name: 'เจ้าหน้าที่คนที่ 1' }
                        ];
                    } catch (e) {
                        this.tasks = [];
                    } finally {
                        this.isLoading = false;
                    }
                },

                saveLocalStorage() {
                    localStorage.setItem('local_planner_tasks', JSON.stringify(this.tasks));
                    localStorage.setItem('local_planner_cats', JSON.stringify(this.categories));
                    localStorage.setItem('local_planner_owners', JSON.stringify(this.owners));
                },

                getDefaultColor(index) {
                    const colors = ['#7c3aed', '#2563eb', '#059669', '#d97706', '#dc2626', '#0d9488', '#0284c7', '#4f46e5'];
                    return colors[index % colors.length];
                },

                getCategoryColor(catName) {
                    let found = this.categories.find(c => c.name === catName);
                    if (found && found.color) return found.color;
                    let idx = this.categories.findIndex(c => c.name === catName);
                    return this.getDefaultColor(idx >= 0 ? idx : 0);
                },

                addCategory() {
                    if (!this.newCategoryName.trim()) return;
                    this.categories.push({ id: Date.now().toString(), name: this.newCategoryName.trim(), color: this.getDefaultColor(this.categories.length) });
                    this.newCategoryName = '';
                    this.saveLocalStorage();
                },

                deleteCategory(id) {
                    this.categories = this.categories.filter(c => c.id !== id);
                    this.saveLocalStorage();
                },

                addOwner() {
                    if (!this.newOwnerName.trim()) return;
                    this.owners.push({ id: Date.now().toString(), name: this.newOwnerName.trim() });
                    this.newOwnerName = '';
                    this.saveLocalStorage();
                },

                deleteOwner(id) {
                    this.owners = this.owners.filter(o => o.id !== id);
                    this.saveLocalStorage();
                },

                toLocalISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
                get currentMonthName() { return this.monthNames[this.currentMonthIndex] + ' ' + (this.currentYearNum + 543); },
                prevMonth() { this.currentMonthIndex--; if (this.currentMonthIndex < 0) { this.currentMonthIndex = 11; this.currentYearNum--; } },
                nextMonth() { this.currentMonthIndex++; if (this.currentMonthIndex > 11) { this.currentMonthIndex = 0; this.currentYearNum++; } },

                buildMonthGrid(year, month) {
                    const firstDow = new Date(year, month, 1).getDay();
                    const totalDays = new Date(year, month + 1, 0).getDate();
                    const today = this.toLocalISO(new Date());
                    const days = [];
                    for (let i = 0; i < firstDow; i++) {
                        days.push({ dayNum: '', dateStr: '', isCurrentMonth: false, isToday: false });
                    }
                    for (let d = 1; d <= totalDays; d++) {
                        const dateObj = new Date(year, month, d);
                        const ds = this.toLocalISO(dateObj);
                        days.push({ dayNum: d, dateStr: ds, isCurrentMonth: true, isToday: ds === today });
                    }
                    return days;
                },
                get calendarDays() { return this.buildMonthGrid(this.currentYearNum, this.currentMonthIndex); },

                getTasksForDate(dateStr) {
                    return this.tasks.filter(task => {
                        let s = task.doStart ? task.doStart.split('T')[0] : '';
                        let e = task.doEnd ? task.doEnd.split('T')[0] : s;
                        return s && dateStr >= s && dateStr <= (e || s);
                    }).map(task => ({ task }));
                },

                openTaskModal() {
                    this.currentTask = { id: null, category: this.categories[0]?.name || '', title: '', doStart: this.toLocalISO(new Date()), doEnd: this.toLocalISO(new Date()) };
                    this.isModalOpen = true;
                },
                editTask(task) {
                    this.currentTask = JSON.parse(JSON.stringify(task));
                    this.isModalOpen = true;
                },
                saveTask() {
                    if (!this.currentTask.title) {
                        alert('กรุณากรอกชื่องาน');
                        return;
                    }
                    if (!this.currentTask.id) {
                        this.currentTask.id = Date.now().toString();
                        this.tasks.push(this.currentTask);
                    } else {
                        let idx = this.tasks.findIndex(t => t.id === this.currentTask.id);
                        if (idx >= 0) this.tasks[idx] = JSON.parse(JSON.stringify(this.currentTask));
                    }
                    this.saveLocalStorage();
                    this.isModalOpen = false;
                },
                deleteTask(task) {
                    if (confirm('ต้องการลบงานนี้ใช่หรือไม่?')) {
                        this.tasks = this.tasks.filter(t => t.id !== task.id);
                        this.saveLocalStorage();
                    }
                }
            };
        }
    </script>
</body>
</html>
